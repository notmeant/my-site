
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>mylo</title>

<style>
:root {
  --bg: #080808;
  --text: #f5f5f5;
  --muted: #a4a4a4;
  --glass: rgba(255,255,255,.045);
  --border: rgba(255,255,255,.11);
  --glow: rgba(255,255,255,.15);
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: var(--bg);
}

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
    sans-serif;
  -webkit-font-smoothing: antialiased;
}

#background {
  position: fixed;
  inset: -40px;
  z-index: -3;
  background-position: center;
  background-size: cover;
  filter: blur(45px) brightness(.35) saturate(.8);
  opacity: .24;
  transform: scale(1.08);
  transition: background-image .6s ease, opacity .5s ease;
}

#background::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.55);
}

#overlay {
  position: fixed;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 50% 35%, transparent 0%, rgba(0,0,0,.5) 100%),
    rgba(0,0,0,.28);
}

main {
  width: min(100% - 32px, 460px);
  margin: 0 auto;
  padding: 48px 0 38px;
  zoom: .792;
}

.glass {
  background: var(--glass);
  border: 1px solid var(--border);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  border-radius: 19px;
  box-shadow: 0 8px 32px rgba(0,0,0,.14);
  transition:
    border-color .25s ease,
    background .25s ease,
    box-shadow .25s ease,
    transform .16s ease;
  transform-style: preserve-3d;
}

.glass:hover {
  background: rgba(255,255,255,.075);
  border-color: rgba(255,255,255,.25);
  box-shadow:
    0 0 30px rgba(255,255,255,.065),
    0 0 65px rgba(255,255,255,.035),
    0 12px 38px rgba(0,0,0,.2);
}

.profile {
  padding: 25px;
  text-align: center;
  position: relative;
  overflow: hidden;
}

.profile::before {
  content: "";
  position: absolute;
  width: 190px;
  height: 190px;
  left: 50%;
  top: -155px;
  transform: translateX(-50%);
  background: rgba(255,255,255,.14);
  filter: blur(65px);
  pointer-events: none;
}

.avatar-wrap {
  position: relative;
  width: 94px;
  height: 94px;
  margin: 0 auto 16px;
}

.avatar {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.2);
  background: #181818;
  box-shadow: 0 0 28px rgba(255,255,255,.06);
}

.status-dot {
  position: absolute;
  right: 3px;
  bottom: 4px;
  width: 15px;
  height: 15px;
  border: 3px solid #111;
  border-radius: 50%;
  background: #777;
}

.status-dot.online {
  background: #43d17b;
}

.status-dot.idle {
  background: #f0b84a;
}

.status-dot.dnd {
  background: #ed5555;
}

h1 {
  margin: 0;
  font-size: 29px;
  font-weight: 650;
  letter-spacing: -.8px;
}

.username {
  margin-top: 6px;
  font-size: 12px;
  color: #aaa;
}

.bio {
  margin: 16px 0 0;
  color: #d0d0d0;
  font-size: 13px;
  line-height: 1.65;
}

.section-title {
  margin: 25px 0 11px 3px;
  color: #aaa;
  text-transform: uppercase;
  font-size: 10px;
  letter-spacing: 2px;
  font-weight: 700;
}

.activity {
  margin-top: 16px;
  padding: 15px;
  display: flex;
  align-items: center;
  gap: 13px;
  min-height: 92px;
  text-align: left;
}

.activity-art {
  width: 58px;
  height: 58px;
  flex-shrink: 0;
  object-fit: cover;
  border-radius: 10px;
  background: #181818;
}

.activity-info {
  min-width: 0;
  flex: 1;
}

.activity-label {
  color: #999;
  font-size: 10px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  margin-bottom: 5px;
}

.activity-title {
  font-size: 13px;
  font-weight: 600;
  overflow-wrap: anywhere;
}

.activity-subtitle {
  margin-top: 4px;
  color: #aaa;
  font-size: 11px;
  overflow-wrap: anywhere;
  line-height: 1.45;
}

.progress-track {
  height: 3px;
  background: rgba(255,255,255,.12);
  border-radius: 5px;
  margin-top: 10px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: #f2f2f2;
  border-radius: 5px;
  transition: width .4s linear;
}

.progress-times {
  display: flex;
  justify-content: space-between;
  margin-top: 5px;
  color: #888;
  font-size: 9px;
  font-variant-numeric: tabular-nums;
}

.projects {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.project {
  padding: 11px;
  color: inherit;
  text-decoration: none;
  min-width: 0;
  display: block;
}

.project img {
  width: 100%;
  height: 125px;
  display: block;
  object-fit: cover;
  border-radius: 11px;
  background: #151515;
  border: 1px solid rgba(255,255,255,.08);
  transition: filter .25s ease;
}

.project:hover img {
  filter: brightness(1.12);
}

.project-name {
  margin: 12px 2px 0;
  font-size: 14px;
  font-weight: 650;
}

.project-description {
  margin: 5px 2px 10px;
  color: #aaa;
  font-size: 11px;
  line-height: 1.5;
  min-height: 32px;
}

.tag {
  display: inline-block;
  margin: 0 2px;
  padding: 5px 8px;
  border-radius: 7px;
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.08);
  color: #c5c5c5;
  font-size: 9px;
}

.roblox {
  padding: 15px;
  display: flex;
  align-items: center;
  gap: 14px;
  text-decoration: none;
  color: inherit;
}

.roblox-avatar {
  width: 65px;
  height: 65px;
  object-fit: cover;
  border-radius: 13px;
  background: #181818;
  border: 1px solid rgba(255,255,255,.12);
  flex-shrink: 0;
}

.roblox-info {
  min-width: 0;
  flex: 1;
}

.roblox-name {
  font-weight: 650;
  font-size: 14px;
}

.roblox-label {
  margin-top: 5px;
  color: #999;
  font-size: 11px;
}

.roblox-arrow {
  color: #777;
  font-size: 20px;
}

.socials {
  margin-top: 16px;
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}

.social-button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  padding: 13px;
  border-radius: 13px;
  text-decoration: none;
  color: #eee;
  font-size: 12px;
  font-weight: 600;
}

.social-button:hover {
  background: rgba(255,255,255,.085);
}

footer {
  padding-top: 24px;
  text-align: center;
  color: #656565;
  font-size: 10px;
  letter-spacing: .6px;
}

@media (max-width: 500px) {
  main {
    width: calc(100% - 24px);
    padding-top: 24px;
  }

  .profile {
    padding: 22px 16px;
  }

  .project img {
    height: 105px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>
<div id="background"></div>
<div id="overlay"></div>

<main>
  <section class="glass profile tilt">
    <div class="avatar-wrap">
      <img
        class="avatar"
        id="profile-avatar"
        src="https://cdn.discordapp.com/embed/avatars/0.png"
        alt="mylo's Discord avatar"
      >
      <span class="status-dot" id="status-dot"></span>
    </div>

    <h1>mylo</h1>
    <div class="username">@traphouse2018 · do not disturb</div>
    <p class="bio">hi im mylo, i like reading manga and coding</p>

    <div class="glass activity tilt" id="activity-card">
      <img
        class="activity-art"
        id="activity-art"
        src="./nothing.jpg"
        alt="Activity artwork"
      >
      <div class="activity-info">
        <div class="activity-label" id="activity-label">CURRENTLY</div>
        <div class="activity-title" id="activity-title">doing nothing atm</div>
        <div class="activity-subtitle" id="activity-subtitle">chilling</div>

        <div id="spotify-progress" hidden>
          <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <div class="progress-times">
            <span id="elapsed">0:00</span>
            <span id="duration">0:00</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div class="section-title">Projects</div>

  <section class="projects">
    <a class="glass project tilt"
       href="https://discord.gg/dhedits"
       target="_blank"
       rel="noopener noreferrer">
      <img src="./dhedits.gif" alt="dhedits server">
      <div class="project-name">dhedits</div>
      <div class="project-description">editing and vault server</div>
      <span class="tag">tutorials</span>
    </a>

    <a class="glass project tilt"
       href="https://discord.gg/curb"
       target="_blank"
       rel="noopener noreferrer">
      <img src="./curb.jpg" alt="curb server">
      <div class="project-name">curb</div>
      <div class="project-description">my private friendgroup :D</div>
      <span class="tag">friendgroup</span>
    </a>
  </section>

  <div class="section-title">Roblox</div>

  <a class="glass roblox tilt"
     href="https://www.roblox.com/users/7928916733/profile"
     target="_blank"
     rel="noopener noreferrer">
    <img
      class="roblox-avatar"
      id="roblox-avatar"
      src="https://tr.rbxcdn.com/30DAY-AvatarHeadshot-1E14173E94117747368B9AD08789B743-Png/420/420/AvatarHeadshot/Png/noFilter"
      alt="Roblox avatar"
    >
    <div class="roblox-info">
      <div class="roblox-name">mylo</div>
      <div class="roblox-label">View Roblox profile</div>
    </div>
    <span class="roblox-arrow">↗</span>
  </a>

  <div class="socials">
    <a class="glass social-button tilt"
       href="https://discord.com/users/664872662501425165"
       target="_blank"
       rel="noopener noreferrer">
      <span>Discord</span>
      <span>↗</span>
    </a>
  </div>

  <footer>made by mylo</footer>
</main>

<script>
const DISCORD_ID = "664872662501425165";
const ROBLOX_ID = "7928916733";

const $ = id => document.getElementById(id);

const background = $("background");
const profileAvatar = $("profile-avatar");
const statusDot = $("status-dot");
const activityArt = $("activity-art");
const activityLabel = $("activity-label");
const activityTitle = $("activity-title");
const activitySubtitle = $("activity-subtitle");
const spotifyProgress = $("spotify-progress");
const progressFill = $("progress-fill");
const elapsedText = $("elapsed");
const durationText = $("duration");

let currentActivity = null;
let currentLanyardData = null;
let spotifyTimer = null;
let lastSpotifyTrack = "";

function setBackground(url) {
  if (!url) return;

  const safeUrl = url.replace(/["\\\n\r]/g, "");
  background.style.backgroundImage = `url("${safeUrl}")`;
}

function formatTime(ms) {
  const seconds = Math.max(0, Math.floor(ms / 1000));
  const minutes = Math.floor(seconds / 60);
  return `${minutes}:${String(seconds % 60).padStart(2, "0")}`;
}

function setStatus(status) {
  statusDot.className = "status-dot";

  if (status === "online") statusDot.classList.add("online");
  else if (status === "idle") statusDot.classList.add("idle");
  else if (status === "dnd") statusDot.classList.add("dnd");
}

function showIdle() {
  currentActivity = null;
  lastSpotifyTrack = "";
  spotifyProgress.hidden = true;

  activityLabel.textContent = "CURRENTLY";
  activityTitle.textContent = "doing nothing atm";
  activitySubtitle.textContent = "chilling";
  activityArt.src = "./nothing.jpg";
  setBackground("./nothing.jpg");
}

function updateProgress() {
  const spotify = currentLanyardData?.spotify;

  if (!spotify || !spotify.timestamps?.start || !spotify.timestamps?.end) {
    spotifyProgress.hidden = true;
    return;
  }

  const now = Date.now();
  const start = spotify.timestamps.start;
  const end = spotify.timestamps.end;
  const total = end - start;
  const elapsed = Math.max(0, Math.min(now - start, total));

  if (total <= 0) {
    spotifyProgress.hidden = true;
    return;
  }

  spotifyProgress.hidden = false;
  progressFill.style.width = `${(elapsed / total) * 100}%`;
  elapsedText.textContent = formatTime(elapsed);
  durationText.textContent = formatTime(total);
}

function updateActivity(data) {
  currentLanyardData = data;

  const spotify = data.spotify;
  const activities = data.activities || [];

  if (spotify) {
    const trackKey = `${spotify.song}:${spotify.artist}:${spotify.album}`;

    activityLabel.textContent = "LISTENING TO SPOTIFY";
    activityTitle.textContent = spotify.song || "Unknown track";
    activitySubtitle.textContent = spotify.artist || "Unknown artist";

    if (trackKey !== lastSpotifyTrack) {
      lastSpotifyTrack = trackKey;

      if (spotify.album_art_url) {
        activityArt.src = spotify.album_art_url;
        setBackground(spotify.album_art_url);
      }

      if (spotify.timestamps?.start && spotify.timestamps?.end) {
        spotifyProgress.hidden = false;
      } else {
        spotifyProgress.hidden = true;
      }
    }

    updateProgress();
    return;
  }

  lastSpotifyTrack = "";
  spotifyProgress.hidden = true;

  const game = activities.find(activity =>
    activity.type === 0 && activity.name !== "Spotify"
  );

  if (game) {
    currentActivity = game;
    activityLabel.textContent = "CURRENTLY PLAYING";
    activityTitle.textContent = game.name || "Playing a game";
    activitySubtitle.textContent =
      [game.details, game.state].filter(Boolean).join(" · ") || "In game";

    let artwork = null;

    if (game.assets?.large_image) {
      const large = game.assets.large_image;

      if (large.startsWith("mp:external/")) {
        artwork = "https://media.discordapp.net/" +
          large.slice("mp:external/".length);
      } else if (large.startsWith("https://") || large.startsWith("http://")) {
        artwork = large;
      } else if (game.application_id) {
        artwork = `https://cdn.discordapp.com/app-assets/${game.application_id}/${large}.png`;
      }
    }

    if (artwork) {
      activityArt.src = artwork;
      setBackground(artwork);
    } else {
      activityArt.src = "./nothing.jpg";
      setBackground("./nothing.jpg");
    }

    return;
  }

  showIdle();
}

async function loadDiscord() {
  try {
    const response = await fetch(
      `https://api.lanyard.rest/v1/users/${DISCORD_ID}`,
      { cache: "no-store" }
    );

    if (!response.ok) throw new Error("Lanyard request failed");

    const result = await response.json();

    if (!result.success || !result.data) {
      throw new Error("Discord presence unavailable");
    }

    const data = result.data;
    const user = data.discord_user;

    if (user?.avatar) {
      const extension = user.avatar.startsWith("a_") ? "gif" : "png";
      profileAvatar.src =
        `https://cdn.discordapp.com/avatars/${DISCORD_ID}/${user.avatar}.${extension}?size=256`;
    } else {
      profileAvatar.src = "https://cdn.discordapp.com/embed/avatars/0.png";
    }

    setStatus(data.discord_status || "offline");
    updateActivity(data);
  } catch (error) {
    console.error("Could not load Discord presence:", error);
    setStatus("offline");
    showIdle();
  }
}

async function loadRobloxAvatar() {
  const avatar = $("roblox-avatar");

  // Use the exact working Roblox CDN URL first.
  avatar.src =
    "https://tr.rbxcdn.com/30DAY-AvatarHeadshot-1E14173E94117747368B9AD08789B743-Png/420/420/AvatarHeadshot/Png/noFilter";

  // If the CDN image fails, try retrieving a fresh thumbnail.
  avatar.onerror = async () => {
    avatar.onerror = null;

    try {
      const response = await fetch(
        `https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${ROBLOX_ID}&size=420x420&format=Png&isCircular=false`
      );

      if (!response.ok) throw new Error("Thumbnail API failed");

      const result = await response.json();
      const item = result.data?.[0];

      if (item?.imageUrl && item.state === "Completed") {
        avatar.src = item.imageUrl;
      }
    } catch (error) {
      console.error("Could not load Roblox avatar:", error);
    }
  };
}

/* Hover tilt: 20% stronger than 3.12 degrees. */
document.querySelectorAll(".tilt").forEach(card => {
  card.addEventListener("mousemove", event => {
    const rect = card.getBoundingClientRect();
    const x = (event.clientX - rect.left) / rect.width;
    const y = (event.clientY - rect.top) / rect.height;

    const rotateY = (x - 0.5) * 3.744;
    const rotateX = (0.5 - y) * 3.744;

    card.style.transform =
      `perspective(900px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
  });

  card.addEventListener("mouseleave", () => {
    card.style.transform =
      "perspective(900px) rotateX(0deg) rotateY(0deg)";
  });
});

loadDiscord();
loadRobloxAvatar();

setInterval(loadDiscord, 15000);
setInterval(updateProgress, 1000);
</script>
</body>
</html>
