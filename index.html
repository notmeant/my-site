
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>mylo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Inter:wght@400;500;600;700;800&display=swap');
:root{color-scheme:dark;--bg:#080808;--border:rgba(255,255,255,.1);--muted:#85858f;--green:#32e69a}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#22222250,transparent 50%),#080808;color:#f5f5f7;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.page{width:min(100% - 36px,510px);margin:auto;padding:76px 0 110px}
.profile{display:flex;align-items:center;gap:20px;margin-bottom:30px}
.avatar-wrap{width:88px;height:88px;position:relative;flex-shrink:0}
.avatar{width:100%;height:100%;object-fit:cover;border-radius:50%;border:1px solid #ffffff40;background:#151515}
.status-dot{position:absolute;bottom:3px;right:0;width:14px;height:14px;background:var(--green);border:3px solid var(--bg);border-radius:50%}
.eyebrow,.username,.section-title{font-family:'DM Mono',monospace;font-size:12px;color:#b2b2bc}
h1{font-size:clamp(44px,10vw,58px);line-height:1.08;font-weight:800;letter-spacing:-3.5px;margin:2px 0 5px}
.card{border:1px solid var(--border);border-radius:16px;background:linear-gradient(125deg,#ffffff0b,#ffffff04);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:hidden;transition:.2s}
a.card:hover{border-color:#ffffff35;background:#ffffff0d;transform:translateY(-2px)}
.bio{padding:21px 19px;font-size:13px;line-height:1.7;margin-bottom:30px;color:#e5e5e9}
.section{margin-top:29px}
.section-title{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.section-title:before{content:"";width:12px;height:1px;background:#a4a4ae}
.link-card{display:flex;align-items:center;gap:14px;padding:13px 15px;min-height:84px}
.icon-box{display:flex;align-items:center;justify-content:center;width:54px;height:54px;flex-shrink:0;border-radius:13px;background:#ffffff0e;border:1px solid #ffffff0d;color:#ededf1;font-size:22px;overflow:hidden}
.icon-box img{width:100%;height:100%;object-fit:cover}
.card-content{min-width:0;flex:1}
.card-heading{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:14px;font-weight:700;letter-spacing:-.3px}
.tag{padding:3px 8px;border:1px solid #ffffff15;border-radius:20px;background:#ffffff09;color:#a5a5af;font:10px 'DM Mono',monospace}
.subtext{margin-top:5px;color:var(--muted);font-size:12px;line-height:1.5;overflow-wrap:anywhere}
.arrow{padding-left:8px;color:#92929c;font-size:17px}
.presence-card{display:flex;align-items:center;gap:14px;padding:13px 15px;min-height:96px}
.presence-name{font-size:14px;font-weight:700}
.presence-line{display:flex;align-items:center;gap:8px;margin-top:5px;color:#a6a6af;font-size:12px}
.small-dot{width:8px;height:8px;flex-shrink:0;border-radius:50%;background:#777}
.small-dot.online{background:var(--green)}
.music-art{width:74px;height:74px;flex-shrink:0;object-fit:cover;border-radius:12px;background:#151515}
.music-progress{height:3px;background:#ffffff22;border-radius:10px;margin-top:10px;overflow:hidden}
.music-progress span{display:block;width:0;height:100%;background:#eee}
.project{margin-bottom:10px}
.project .link-card{min-height:75px}
.project .icon-box{width:48px;height:48px}
.server-picture{width:42px;height:42px;object-fit:cover;border-radius:50%;background:#171717;border:1px solid #ffffff18}
.server-icons{display:flex;align-items:center;gap:10px}
.discord-wrap{display:flex;justify-content:center;margin-top:38px}
.discord-button{display:inline-flex;align-items:center;gap:9px;padding:12px 18px;border:1px solid #ffffff1e;border-radius:30px;background:#ffffff0b;box-shadow:0 0 30px #ffffff0b;font-size:12px;font-weight:600;transition:.2s}
.discord-button:hover{background:#ffffff16;transform:translateY(-2px)}
.discord-button svg{width:17px;height:17px;fill:currentColor}
.views{position:fixed;bottom:20px;right:22px;padding:7px 12px;border:1px solid var(--border);border-radius:30px;background:#0c0c0ce0;color:#777780;font-size:10px}
@media(max-width:480px){.page{padding-top:55px}.avatar-wrap{width:72px;height:72px}.profile{gap:15px}h1{letter-spacing:-2.5px}.views{bottom:12px;right:12px}}
</style>
</head>
<body>
<main class="page">

<header class="profile">
  <div class="avatar-wrap">
    <img class="avatar" id="discord-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Mylo avatar">
    <span class="status-dot" id="avatar-status"></span>
  </div>
  <div>
    <div class="eyebrow">hey, i'm</div>
    <h1>mylo</h1>
    <div class="username" id="username">@mylo</div>
  </div>
</header>

<div class="card bio">hi im mylo, i like reading manga and coding fun stuff</div>

<section class="section">
  <div class="section-title">roblox</div>
  <a class="card link-card" href="https://www.roblox.com/users/7928916733/profile" target="_blank" rel="noopener noreferrer">
    <div class="icon-box">
      <img id="roblox-avatar" src="https://www.roblox.com/favicon.ico" alt="Roblox avatar">
    </div>
    <div class="card-content">
      <div class="card-heading"><span id="roblox-name">Roblox profile</span><span class="tag">roblox</span></div>
      <div class="subtext" id="roblox-handle">@mylo · profile</div>
    </div>
    <span class="arrow">↗</span>
  </a>
</section>

<section class="section">
  <div class="section-title">right now</div>
  <div class="card presence-card">
    <img class="music-art" id="music-art" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Music or activity artwork">
    <div class="card-content">
      <div class="presence-name" id="activity-title">Activity unavailable</div>
      <div class="subtext" id="activity-artist">Discord activity</div>
      <div class="presence-line"><span class="small-dot" id="presence-dot"></span><span id="activity-detail">Discord · not connected</span></div>
      <div class="music-progress" id="music-progress" hidden><span id="music-bar"></span></div>
    </div>
  </div>
</section>

<section class="section">
  <div class="section-title">projects</div>

  <div class="project">
    <a class="card link-card" href="#" onclick="return false;">
      <div class="icon-box">✦</div>
      <div class="card-content">
        <div class="card-heading">dhedits</div>
        <div class="subtext">editing and vault server</div>
      </div>
      <div class="server-icons">
        <img class="server-picture" id="dhedits-picture" src="gg-dheditss_server_logo.gif" alt="dhedits server picture">
      </div>
    </a>
  </div>

  <div class="project">
    <a class="card link-card" href="#" onclick="return false;">
      <div class="icon-box">✦</div>
      <div class="card-content">
        <div class="card-heading">curb</div>
        <div class="subtext">my private friendgroup :D</div>
      </div>
      <div class="server-icons">
        <img class="server-picture" id="curb-picture" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="curb server picture">
      </div>
    </a>
  </div>
</section>

<div class="discord-wrap">
  <a class="discord-button" href="https://discord.com/users/664872662501425165" target="_blank" rel="noopener noreferrer">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.7 5.3A18.7 18.7 0 0 0 15.1 4l-.6 1.2a17.2 17.2 0 0 0-5 0L8.9 4a18.7 18.7 0 0 0-4.6 1.3C1.4 9.5.6 13.6 1 17.6a18.8 18.8 0 0 0 5.7 2.9l1.2-2a12.1 12.1 0 0 1-1.9-.9l.5-.4c3.7 1.7 7.7 1.7 11.4 0l.5.4a12.1 12.1 0 0 1-1.9.9l1.2 2a18.8 18.8 0 0 0 5.7-2.9c.5-4.6-.8-8.7-3.7-12.3ZM8.5 15.3c-1.1 0-2-1-2-2.2s.9-2.2 2-2.2 2 1 2 2.2-.9 2.2-2 2.2Zm7 0c-1.1 0-2-1-2-2.2s.9-2.2 2-2.2 2 1 2 2.2-.9 2.2-2 2.2Z"/></svg>
    discord
  </a>
</div>
</main>

<div class="views">views unavailable</div>

<script>
const ROBLOX_ID = "7928916733";
const DISCORD_ID = "664872662501425165";

function setImage(id, url) {
  if (!url) return;
  const img = document.getElementById(id);
  img.onerror = () => {
    img.onerror = null;
    console.warn("Could not load image:", url);
  };
  img.src = url;
}

async function loadRoblox() {
  try {
    const response = await fetch(`https://users.roblox.com/v1/users/${ROBLOX_ID}`);
    if (!response.ok) throw new Error("Roblox request failed");
    const user = await response.json();

    document.getElementById("roblox-name").textContent =
      user.displayName || user.name;
    document.getElementById("roblox-handle").textContent =
      "@" + user.name + " · profile";

    const thumbResponse = await fetch(
      `https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${ROBLOX_ID}&size=150x150&format=Png&isCircular=false`
    );

    if (thumbResponse.ok) {
      const thumbs = await thumbResponse.json();
      if (thumbs.data?.[0]?.imageUrl) {
        setImage("roblox-avatar", thumbs.data[0].imageUrl);
      }
    }
  } catch (error) {
    console.error("Roblox profile failed to load:", error);
  }
}

async function loadDiscord() {
  try {
    const response = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
    if (!response.ok) throw new Error("Lanyard request failed");

    const result = await response.json();
    if (!result.success || !result.data) throw new Error("No presence data");

    const data = result.data;
    const user = data.discord_user;

    if (user) {
      document.getElementById("username").textContent = "@" + user.username;

      if (user.avatar) {
        const ext = user.avatar.startsWith("a_") ? "gif" : "png";
        setImage("discord-avatar",
          `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${ext}?size=256`);
      }
    }

    const status = data.discord_status || "offline";
    document.getElementById("avatar-status").style.background =
      status === "online" ? "#32e69a" :
      status === "idle" ? "#f0b232" :
      status === "dnd" ? "#f04747" : "#777";

    const dot = document.getElementById("presence-dot");
    dot.className = "small-dot" + (status === "online" ? " online" : "");

    const spotify = data.spotify;
    const activities = data.activities || [];

    if (spotify && spotify.track_id) {
      document.getElementById("activity-title").textContent = spotify.song || "Spotify";
      document.getElementById("activity-artist").textContent = spotify.artist || "";
      document.getElementById("activity-detail").textContent =
        "Spotify · " + (spotify.album || "Now playing");

      if (spotify.album_art_url) {
        setImage("music-art", spotify.album_art_url);
      }

      document.getElementById("music-progress").hidden = false;

      function updateProgress() {
        const start = spotify.timestamps?.start;
        const end = spotify.timestamps?.end;
        const duration = end - start;
        const elapsed = Date.now() - start;
        const percent = duration > 0
          ? Math.max(0, Math.min(100, elapsed / duration * 100))
          : 0;
        document.getElementById("music-bar").style.width = percent + "%";
      }

      updateProgress();
    } else {
      const activity = activities.find(a => a.type !== 4);

      if (activity) {
        document.getElementById("activity-title").textContent =
          activity.name || "Active";
        document.getElementById("activity-artist").textContent =
          activity.details || activity.state || "";
        document.getElementById("activity-detail").textContent =
          "Discord · " + status;

        const image = activity.assets?.large_image;

        if (image && activity.application_id) {
          if (image.startsWith("mp:external/")) {
            setImage("music-art",
              "https://media.discordapp.net/" + image.slice(12));
          } else {
            setImage("music-art",
              `https://cdn.discordapp.com/app-assets/${activity.application_id}/${image}.png`);
          }
        }
      } else {
        document.getElementById("activity-title").textContent =
          status === "offline" ? "Offline" : "Not listening right now";
        document.getElementById("activity-artist").textContent = "";
        document.getElementById("activity-detail").textContent =
          "Discord · " + status;
      }
    }
  } catch (error) {
    document.getElementById("activity-title").textContent =
      "Activity unavailable";
    document.getElementById("activity-artist").textContent = "";
    document.getElementById("activity-detail").textContent =
      "Join the Lanyard Discord server to share presence";
    console.error("Discord presence failed to load:", error);
  }
}

loadRoblox();
loadDiscord();
</script>
</body>
</html>
